name: Node.js CI/CD con Jest

on:
  push:
    branches: [main]

jobs:
  # TRABAJO 1: PRUEBAS UNITARIAS CON JEST
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      # Se añade --watchAll=false para asegurar que se ejecute una sola vez y termine
      - name: Ejecutar pruebas con Jest
        run: npm test -- --watchAll=false --passWithNoTests

  # TRABAJO 2: DESPLIEGUE AUTOMÁTICO
  deploy:
    runs-on: ubuntu-latest
    needs: test # Obliga a que pasen los tests primero

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Desplegar aplicación
        run: |
          echo "¡Excelente! Jest validó el código con éxito."
          echo "Conectando con el servidor para iniciar el despliegue..."
          # Aquí debes añadir el comando de tu hosting
